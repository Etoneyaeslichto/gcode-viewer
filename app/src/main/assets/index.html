<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-code: траектория</title>
<style>
:root{--bg:#fff;--fg:#1a1a18;--mut:#6b6a64;--bd:#d6d4cc;--sf:#f4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#ecebe5;--mut:#a3a199;--bd:#3a3935;--sf:#262624}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#ecebe5;--mut:#a3a199;--bd:#3a3935;--sf:#262624}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:12px;max-width:900px;margin:0 auto}
textarea{width:100%;box-sizing:border-box;height:170px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,label.b{font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:#1D9E75;color:#fff;border-color:#1D9E75}
canvas{display:block;width:100%;height:55vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input[type=range]{width:100%;margin:10px 0}
.s{font-size:13px;color:var(--mut)}
#er{font-size:13px;color:#D85A30}

section[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
.tb{flex:1}.tb.on,.tl button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.tl{display:flex;gap:6px;overflow-x:auto;margin:6px 0;padding-bottom:2px}
.tl button,.tl select{flex:none;font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;white-space:nowrap}
.cw{position:relative}
.ov{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ov button{padding:4px 8px;font-size:12px}
#c2{display:block;width:100%;height:58vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input.n{width:58px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--fg)}
details.s{margin:6px 0}
button[data-i],label[data-i]{display:inline-flex;align-items:center;gap:6px}
.tb{justify-content:center}
svg.i{width:20px;height:20px;flex:none}
#tools button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px}
.sb{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.sb button,.ov button{width:38px;height:38px;padding:0;justify-content:center;background:var(--bg);opacity:.93;display:flex;align-items:center}
.ov button{width:34px;height:34px}
.sb button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
details.s>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--fg);font-size:14px}
details.s>summary::-webkit-details-marker{display:none}
details.s>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}
details.s[open]>summary::after{transform:rotate(-135deg)}
.pi{margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:8px}
.pr{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}
.pr b{font-size:13px;font-weight:600;line-height:1.25;color:var(--fg)}
.pr small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.f{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.f:focus-within{border-color:#1D9E75}
.f span,.f em{font-size:12px;font-weight:600;color:var(--mut);font-style:normal}
.f input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;text-align:right}
#nok{justify-content:center;height:42px}
.cd{margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:12px}
.lb{font-size:12px;color:var(--mut);margin-bottom:5px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:8px 4px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.seg button.on{background:#1D9E75;color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.sw small{display:block;font-size:11px;color:var(--mut)}
.sw input{display:none}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.15s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:#1D9E75}
.sw input:checked+i::after{left:21px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#c3{display:block;width:100%;height:230px;min-height:0;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin:6px 0}
#out3{height:280px}
#chips button{flex:none;display:flex;align-items:center;gap:6px}
#rThr{display:grid;gap:12px}
#chips button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
</style></head><body><main>
<nav class="tabs"><button class="tb on" id="tb1" data-i="path">Траектория</button><button class="tb" id="tb2" data-i="pencil">Чертёж</button><button class="tb" id="tb3" data-i="code">G-код</button></nav>
<section id="t1">
<textarea id="src" spellcheck="false" style="height:110px" placeholder="Вставьте G-код сюда или нажмите «Файл»"></textarea>
<div class="row"><button class="p" id="go" data-i="play">Показать</button><label class="b" data-i="file">Файл<input type="file" id="fl" hidden></label><button id="sv" data-i="save">Сохранить .nc</button><button id="cl" data-i="trash">Очистить</button></div>
<div id="er"></div><div class="s" id="wn"></div><div class="s" id="ms"></div>
<div class="cw"><canvas id="cv"></canvas><div class="ov"><button id="vt" data-i="top" title="Сверху"></button><button id="vi" data-i="cube" title="Объём"></button><button id="vf" data-i="fit" title="Вписать"></button></div></div>
<input type="range" id="sl" min="0" max="0" value="0">
<div class="s" id="st"></div>
<details class="s"><summary>Настройки стойки</summary><label><input type="checkbox" id="dpi" checked> DPI=1 (целое без точки = мм)</label><br><label><input type="checkbox" id="lin"> G0 по прямой</label></details>
</section>
<section id="t2" hidden>
<div class="tl" id="tools"><button data-k="sel" data-i="sel">Выбор</button><button data-k="line" data-i="line">Отрезок</button><button data-k="circ" data-i="circ">Окружность</button><button data-k="ax" data-i="ax">Прямая</button><button data-k="trim" data-i="trim">Обрезка</button><button data-k="dim" data-i="dim">Размер</button><button data-k="del" data-i="eraser">Удалить</button></div>
<div class="tl" id="axr" style="display:none"><select id="axm"><option value="2p">Через 2 точки</option><option value="h">Горизонтальная</option><option value="v">Вертикальная</option><option value="par">Параллельная</option><option value="perp">Перпендикулярная</option></select></div>
<div class="cw"><canvas id="c2"></canvas><div class="sb"><button id="bAux" data-i="aux" title="Вспомогательная линия"></button><button id="bOrt" data-i="ort" title="Орто"></button><button id="bGrd" data-i="grid" title="Сетка"></button><button id="bUn" data-i="undo" title="Отмена"></button><button id="bEsc" data-i="esc" title="Esc: закончить"></button><button id="bFit" data-i="fit" title="Вписать"></button><button id="bClr" data-i="trash" title="Очистить чертёж"></button></div></div>
<div class="s" id="h2"></div><div class="s" id="i2"></div>
<details class="s"><summary data-i="ruler">Точный ввод</summary><div class="pi">
<div class="pr"><b>Точка<small>по координатам</small></b><label class="f"><span style="color:#D85A30">X</span><input id="nx" inputmode="decimal" placeholder="0"></label><label class="f"><span style="color:#1D9E75">Y</span><input id="ny" inputmode="decimal" placeholder="0"></label></div>
<div class="pr"><b>Окружность<small>радиус</small></b><label class="f"><span>R</span><input id="nr" inputmode="decimal" placeholder="0"></label><i></i></div>
<div class="pr"><b>Отрезок<small>длина и угол</small></b><label class="f"><span>L</span><input id="nl" inputmode="decimal" placeholder="0"></label><label class="f"><span>∠</span><input id="na" inputmode="decimal" placeholder="0"><em>°</em></label></div>
<button class="p" id="nok" data-i="check">Ввод</button>
</div></details>
</section>
<section id="t3" hidden>
<div class="tl" id="chips"></div>
<div class="s" id="n3"></div>
<canvas id="c3"></canvas>
<div class="cd">
<div id="rOp"><div class="lb">Операция</div><div class="seg" id="sOp"><button data-v="mill" data-i="circ">Фрезерование</button><button data-v="thr" data-i="thread">Резьба</button></div></div>
<div id="rThr">
<div><div class="lb">Резьба</div><div class="seg" id="sTk"><button data-v="in">Внутренняя</button><button data-v="out">Наружная</button></div></div>
<div><div class="lb">Направление витка</div><div class="seg" id="sHand"><button data-v="R">Правая</button><button data-v="L">Левая</button></div></div>
<div><div class="lb">Ход фрезы по Z</div><div class="seg" id="sTdir"><button data-v="up" data-i="up">Снизу вверх</button><button data-v="dn" data-i="dn">Сверху вниз</button></div></div>
<label class="sw"><span>Зачистной проход<small>повтор последнего прохода без смещения</small></span><input type="checkbox" id="spr"><i></i></label>
</div>
<div id="rSide"><div class="lb" id="lSide">Сторона</div><div class="seg" id="sSide"></div></div>
<div id="rMil"><div class="lb">Фрезерование</div><div class="seg" id="sMil"><button data-v="1">Попутное</button><button data-v="0">Встречное</button></div></div>
<div id="rDir"><div class="lb">Направление движения</div><div class="seg" id="sDir"><button data-v="0">Прямое</button><button data-v="1">Обратное</button></div></div>
<label class="sw"><span>Коррекция G41/G42<small>выкл. — радиус фрезы в переменной #120</small></span><input type="checkbox" id="cmp"><i></i></label>
<div id="rEnt"><div class="lb">Опускание по Z</div><div class="seg" id="sEnt"><button data-v="sp" data-i="spiral">Спираль</button><button data-v="sd" data-i="down">Отвод · вниз · подвод</button></div></div>
<label class="sw" id="rFin"><span>Чистовой проход на дне<small>последний круг без припуска</small></span><input type="checkbox" id="fin"><i></i></label>
<div class="pg" id="pg"></div>
</div>
<div class="s" id="h3"></div><div class="s" id="w3" style="color:#D85A30"></div>
<textarea id="out3" spellcheck="false"></textarea>
<div class="row"><button class="p" id="cp3" data-i="copy">Копировать</button><button id="sv3" data-i="save">Сохранить .nc</button><button id="go3" data-i="play">В траекторию</button></div>
<div class="s" id="m3"></div>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var pts=[],idx=0,yaw=-0.6,pit=0.6,zm=1,px=0,py=0,m3=true,bb=null;
function mb(s,i){var d=0;for(var j=i;j<s.length;j++){if(s[j]==='[')d++;else if(s[j]===']'){d--;if(d===0)return j}}return s.length-1}
function words(s){var o=[],i=0;while(i<s.length){var c=s[i++];if(!/[A-Z]/.test(c))continue;var j=i;if(s[j]==='-'||s[j]==='+')j++;if(s[j]==='['){j=mb(s,j)+1}else if(s[j]==='#'){j++;while(/\d/.test(s[j]||''))j++}else{while(/[\d.]/.test(s[j]||''))j++}o.push([c,s.slice(i,j)]);i=j}return o}
function run(src){
var err='',V={},raw=[],msg=[],num=[],warn={},nPt=0;
src.split('\n').forEach(function(l,i){var m=(l.match(/\(([^)]*)\)/)||[])[1]||'',s=l.replace(/\([^)]*\)/g,'').replace(/\s+/g,'').toUpperCase().replace(/^\//,'');if(s&&s!=='%'){raw.push(s);msg.push(m);num.push(i+1)}});
var lab={};raw.forEach(function(s,i){var m=s.match(/^N(\d+)/);if(m)lab[+m[1]]=i});
var L=raw.map(function(s){return s.replace(/^N\d+/,'')});
var g=function(n){return V[n]||0};
var F={SIN:function(a){return Math.sin(a*Math.PI/180)},COS:function(a){return Math.cos(a*Math.PI/180)},TAN:function(a){return Math.tan(a*Math.PI/180)},SQRT:Math.sqrt,ABS:Math.abs,ROUND:Math.round,FIX:Math.floor,FUP:Math.ceil};
var cmp={GE:'>=',GT:'>',LE:'<=',LT:'<',EQ:'==',NE:'!='};
function ev(e){e=e.replace(/\[/g,'(').replace(/\]/g,')').replace(/#(\d+)/g,'g($1)').replace(/GE|GT|LE|LT|EQ|NE/g,function(k){return cmp[k]});return +(new Function('g','SIN','COS','TAN','SQRT','ABS','ROUND','FIX','FUP','return ('+e+')'))(g,F.SIN,F.COS,F.TAN,F.SQRT,F.ABS,F.ROUND,F.FIX,F.FUP)}
var pc=0,x=0,y=0,z=0,abs=true,mode=0,steps=0,P=[{x:0,y:0,z:0,r:1}];
function rap(a,b,c){
if($('lin').checked){P.push({x:a,y:b,z:c,r:1});return}
var p=[x,y,z],t=[a,b,c],r=[0,1,2].map(function(i){return Math.abs(t[i]-p[i])}),sg=[0,1,2].map(function(i){return t[i]>=p[i]?1:-1}),n=0;
while(true){var act=[0,1,2].filter(function(i){return r[i]>1e-9});if(!act.length)break;var m=Math.min.apply(null,act.map(function(i){return r[i]}));act.forEach(function(i){p[i]+=sg[i]*m;r[i]-=m});P.push({x:p[0],y:p[1],z:p[2],r:1});n++}
if(n){var q=P[P.length-1];q.x=a;q.y=b;q.z=c}}
function asg(s,k){var m=s.match(/^#(\d+)=(.+)$/);if(!m)return false;var v=ev(m[2]);if(+m[1]===3000){err='Макро-тревога 3000'+(msg[k]?': '+msg[k]:'')+' (значение '+v+', строка '+num[k]+')';pc=1e9}else V[+m[1]]=v;return true}
try{
while(pc<L.length&&steps++<400000){
var s=L[pc++],k=pc-1;if(!s||/^O\d+$/.test(s))continue;
if(s[0]==='#'){asg(s,k);continue}
if(s.indexOf('IF[')===0){var e=mb(s,2),rest=s.slice(e+1);if(ev(s.slice(2,e+1))){if(rest.indexOf('THEN')===0)asg(rest.slice(4),k);else if(rest.indexOf('GOTO')===0){var t=lab[ev(rest.slice(4))];if(t===undefined){err='Нет метки, строка '+num[k];break}pc=t}}continue}
if(s.indexOf('WHILE[')===0){var e2=mb(s,5),dn=s.slice(e2+1).replace('DO','');if(!ev(s.slice(5,e2+1))){var j=pc;while(j<L.length&&L[j]!=='END'+dn)j++;pc=j+1}continue}
var me=s.match(/^END(\d+)$/);if(me){var q=pc-2;while(q>=0&&!(L[q].indexOf('WHILE[')===0&&L[q].slice(-(me[1].length+2))==='DO'+me[1]))q--;if(q<0){err='END без WHILE, строка '+num[k];break}pc=q;continue}
if(s.indexOf('GOTO')===0){var t2=lab[ev(s.slice(4))];if(t2===undefined){err='Нет метки, строка '+num[k];break}pc=t2;continue}
var w={},skip=false,fin=false;
words(s).forEach(function(a){var c=a[0],v=a[1];
if(c==='G'){var n=ev(v);if(n===0||n===1||n===2||n===3)mode=n;else if(n===90)abs=true;else if(n===91)abs=false;else if(n===28||n===30||n===53||n===4)skip=true;else if(n===41||n===42)warn['G41/G42 не учитываются, путь показан как в программе']=1;else if(n>=81&&n<=89)warn['Циклы G81–G89 не рисуются']=1;else if(n===18||n===19)warn['G18/G19 не поддерживаются']=1}
else if(c==='M'){var m=ev(v);if(m===30||m===2)fin=true;else if(m===98)warn['M98: подпрограммы не выполняются']=1}
else if('XYZIJR'.indexOf(c)>=0&&v){if(/^[-+]?#\d+$/.test(v)&&V[+v.replace(/[-+#]/g,'')]===undefined)return;var val=ev(v);if(/^[-+]?\d+$/.test(v)){nPt++;if(!$('dpi').checked)val/=1000}w[c]=val}});
if(skip){if(fin)break;continue}
var has=w.X!==undefined||w.Y!==undefined||w.Z!==undefined;
var nx=w.X!==undefined?(abs?w.X:x+w.X):x,ny=w.Y!==undefined?(abs?w.Y:y+w.Y):y,nz=w.Z!==undefined?(abs?w.Z:z+w.Z):z;
if(mode<2){if(has){if(mode===0)rap(nx,ny,nz);else P.push({x:nx,y:ny,z:nz,r:0});x=nx;y=ny;z=nz}}
else if(has||w.I!==undefined||w.J!==undefined||w.R!==undefined){
var cx,cy;
if(w.R!==undefined){var dx=nx-x,dy=ny-y,d=Math.hypot(dx,dy);if(d<1e-9||Math.abs(w.R)<d/2-1e-6){err='Тревога P/S 023: неверный радиус R, строка '+num[k];break}var h=Math.sqrt(Math.max(0,w.R*w.R-d*d/4)),sg=(mode===3?1:-1)*(w.R>0?1:-1);cx=(x+nx)/2-sg*h*dy/d;cy=(y+ny)/2+sg*h*dx/d}
else{cx=x+(w.I||0);cy=y+(w.J||0);var dr=Math.abs(Math.hypot(x-cx,y-cy)-Math.hypot(nx-cx,ny-cy));if(dr>0.01){err='Тревога P/S 020: разность радиусов дуги '+dr.toFixed(3)+' мм, строка '+num[k];break}}
var a0=Math.atan2(y-cy,x-cx),a1=Math.atan2(ny-cy,nx-cx),sw=a1-a0,TP=2*Math.PI;
if(mode===3){while(sw<=1e-9)sw+=TP}else{while(sw>=-1e-9)sw-=TP}
var r0=Math.hypot(x-cx,y-cy),r1=Math.hypot(nx-cx,ny-cy),n2=Math.max(2,Math.ceil(Math.abs(sw)/0.05));
for(var i=1;i<=n2;i++){var tt=i/n2,aa=a0+sw*tt,rr=r0+(r1-r0)*tt;P.push({x:cx+rr*Math.cos(aa),y:cy+rr*Math.sin(aa),z:z+(nz-z)*tt,r:0})}
P[P.length-1].x=nx;P[P.length-1].y=ny;x=nx;y=ny;z=nz}
if(fin)break}
}catch(ex){err='Ошибка в строке '+num[Math.max(0,pc-1)]+': '+ex.message}
if(steps>=400000)err='Слишком много шагов (возможен бесконечный цикл)';
if(nPt)warn['Значений без точки: '+nPt+' (X10 = 10 мм при DPI=1 и 0.010 мм при DPI=0)']=1;
$('er').textContent=err;$('wn').textContent=Object.keys(warn).join(' · ');
pts=P;idx=P.length-1;$('sl').max=idx;$('sl').value=idx;
var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9],cut=0,rap_=0;
for(var u=0;u<P.length;u++){var p=P[u];mn=[Math.min(mn[0],p.x),Math.min(mn[1],p.y),Math.min(mn[2],p.z)];mx=[Math.max(mx[0],p.x),Math.max(mx[1],p.y),Math.max(mx[2],p.z)];if(u){var l=Math.hypot(p.x-P[u-1].x,p.y-P[u-1].y,p.z-P[u-1].z);if(p.r)rap_+=l;else cut+=l}}
bb={c:[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2],r:Math.max(1e-3,Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2),mn:mn,mx:mx,cut:cut,rap:rap_};
draw()}
function draw(){
var cv=$('cv'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
