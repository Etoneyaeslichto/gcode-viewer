<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-code: траектория</title>
<style>
:root{--bg:#fff;--fg:#1a1a18;--mut:#6b6a64;--bd:#d6d4cc;--sf:#f4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#ecebe5;--mut:#a3a199;--bd:#3a3935;--sf:#262624}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#ecebe5;--mut:#a3a199;--bd:#3a3935;--sf:#262624}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:12px;max-width:900px;margin:0 auto}
textarea{width:100%;box-sizing:border-box;height:170px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,label.b{font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:#1D9E75;color:#fff;border-color:#1D9E75}
canvas{display:block;width:100%;height:55vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input[type=range]{width:100%;margin:10px 0}
.s{font-size:13px;color:var(--mut)}
#er{font-size:13px;color:#D85A30}

section[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
.tb{flex:1}.tb.on,.tl button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.tl{display:flex;gap:6px;overflow-x:auto;margin:6px 0;padding-bottom:2px}
.tl button,.tl select{flex:none;font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;white-space:nowrap}
.cw{position:relative}
.ov{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ov button{padding:4px 8px;font-size:12px}
#c2{display:block;width:100%;height:58vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input.n{width:58px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--fg)}
details.s{margin:6px 0}
button[data-i],label[data-i]{display:inline-flex;align-items:center;gap:6px}
.tb{justify-content:center}
svg.i{width:20px;height:20px;flex:none}
#tools button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px}
.sb{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.sb button,.ov button{width:38px;height:38px;padding:0;justify-content:center;background:var(--bg);opacity:.93;display:flex;align-items:center}
.ov button{width:34px;height:34px}
.sb button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
details.s>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--fg);font-size:14px}
details.s>summary::-webkit-details-marker{display:none}
details.s>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}
details.s[open]>summary::after{transform:rotate(-135deg)}
.pi{margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:8px}
.pr{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}
.pr b{font-size:13px;font-weight:600;line-height:1.25;color:var(--fg)}
.pr small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.f{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.f:focus-within{border-color:#1D9E75}
.f span,.f em{font-size:12px;font-weight:600;color:var(--mut);font-style:normal}
.f input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;text-align:right}
#nok{justify-content:center;height:42px}
.cd{margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:12px}
.lb{font-size:12px;color:var(--mut);margin-bottom:5px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:8px 4px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.seg button.on{background:#1D9E75;color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.sw small{display:block;font-size:11px;color:var(--mut)}
.sw input{display:none}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.15s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:#1D9E75}
.sw input:checked+i::after{left:21px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#c3{display:block;width:100%;height:230px;min-height:0;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin:6px 0}
#out3{height:280px}
#chips button{flex:none;display:flex;align-items:center;gap:6px}
#rThr{display:grid;gap:12px}
#chips button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}

.tabs .tb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;line-height:1.2;min-width:0}
.wide{width:100%;justify-content:center;margin:8px 0}
.opc{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);margin:8px 0}
.opc.bad{border-color:#D85A30}
.opn{width:24px;height:24px;border-radius:50%;background:#1D9E75;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.opi{display:flex;color:var(--mut);flex:none}
.opt{flex:1;min-width:0;cursor:pointer}.opt b{display:block;font-size:14px;font-weight:600}.opt small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opc.bad .opt small{color:#D85A30;white-space:normal}
.ib{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib.arm,button.arm{border-color:#D85A30;color:#D85A30}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tg button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:12px;text-align:left}
.tg button b{font-size:14px;font-weight:600}.tg button small{font-size:11px;color:var(--mut);line-height:1.3}
.ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ch button{flex:none;white-space:nowrap;padding:7px 10px}
.ch button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kv div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}.kv small{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:15px;font-weight:600}
.h{font-size:15px;font-weight:600}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);flex:none}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.danger{color:#D85A30}
.cd .lb{margin-top:2px}
#c3{height:240px}
#out3{height:200px}
#opEd .cd{margin:8px 0}
</style></head><body><main>
<nav class="tabs"><button class="tb on" id="tb1" data-i="path">Траектория</button><button class="tb" id="tb2" data-i="pencil">Чертёж</button><button class="tb" id="tb3" data-i="list">Операции</button><button class="tb" id="tb4" data-i="tool">Инструмент</button><button class="tb" id="tb5" data-i="file">Файлы</button></nav>

<div id="er"></div><div class="s" id="wn"></div><div class="s" id="ms"></div>
<div class="cw"><canvas id="cv"></canvas><div class="ov"><button id="vt" data-i="top" title="Сверху"></button><button id="vi" data-i="cube" title="Объём"></button><button id="vf" data-i="fit" title="Вписать"></button></div></div>
<input type="range" id="sl" min="0" max="0" value="0">
<div class="s" id="st"></div>

</section>
<section id="t2" hidden>
<div class="tl" id="tools"><button data-k="sel" data-i="sel">Выбор</button><button data-k="line" data-i="line">Отрезок</button><button data-k="circ" data-i="circ">Окружность</button><button data-k="ax" data-i="ax">Прямая</button><button data-k="trim" data-i="trim">Обрезка</button><button data-k="dim" data-i="dim">Размер</button><button data-k="del" data-i="eraser">Удалить</button><button data-k="zero" data-i="zero">Ноль</button></div>
<div class="tl" id="axr" style="display:none"><select id="axm"><option value="2p">Через 2 точки</option><option value="h">Горизонтальная</option><option value="v">Вертикальная</option><option value="par">Параллельная</option><option value="perp">Перпендикулярная</option></select></div>
<div class="cw"><canvas id="c2"></canvas><div class="sb"><button id="bAux" data-i="aux" title="Вспомогательная линия"></button><button id="bOrt" data-i="ort" title="Орто"></button><button id="bGrd" data-i="grid" title="Сетка"></button><button id="bUn" data-i="undo" title="Отмена"></button><button id="bEsc" data-i="esc" title="Esc: закончить"></button><button id="bFit" data-i="fit" title="Вписать"></button><button id="bClr" data-i="trash" title="Очистить чертёж"></button></div></div>
<div class="s" id="h2"></div><div class="s" id="i2"></div>
<details class="s"><summary data-i="ruler">Точный ввод</summary><div class="pi">
<div class="pr"><b>Точка<small>по координатам</small></b><label class="f"><span style="color:#D85A30">X</span><input id="nx" inputmode="decimal" placeholder="0"></label><label class="f"><span style="color:#1D9E75">Y</span><input id="ny" inputmode="decimal" placeholder="0"></label></div>
<div class="pr"><b>Окружность<small>радиус</small></b><label class="f"><span>R</span><input id="nr" inputmode="decimal" placeholder="0"></label><i></i></div>
<div class="pr"><b>Отрезок<small>длина и угол</small></b><label class="f"><span>L</span><input id="nl" inputmode="decimal" placeholder="0"></label><label class="f"><span>∠</span><input id="na" inputmode="decimal" placeholder="0"><em>°</em></label></div>
<button class="p" id="nok" data-i="check">Ввод</button>
</div></details>
</section>
<section id="t3" hidden>
<div id="opView">
<div class="cd">
<div class="pg"><label class="f"><span>Программа O</span><input id="pgN" inputmode="numeric"></label><label class="f"><span>Название</span><input id="pgName"></label></div>
<details class="s" id="stkD" style="margin:0"><summary data-i="box">Заготовка <span id="stkSum" style="color:var(--mut)"></span></summary><div class="pi"><div class="pg"><label class="f"><span>X от</span><input id="sk_x0" inputmode="decimal"></label><label class="f"><span>X до</span><input id="sk_x1" inputmode="decimal"></label><label class="f"><span>Y от</span><input id="sk_y0" inputmode="decimal"></label><label class="f"><span>Y до</span><input id="sk_y1" inputmode="decimal"></label><label class="f"><span>Z верх</span><input id="sk_zt" inputmode="decimal"></label><label class="f"><span>Z низ</span><input id="sk_zb" inputmode="decimal"></label></div><div class="row" style="margin:0"><button id="stkDraw" data-i="fit">По чертежу +2 мм</button><button id="stkOff">Без заготовки</button></div></div></details>
</div>
<div id="opList"></div>
<button class="p wide" id="opAdd" data-i="plus">Добавить операцию</button>
<div id="opPick" hidden></div>
<div class="cd" id="sumCard"><div class="kv" id="sumKv"></div><div class="s danger" id="sumW"></div><textarea id="out3" spellcheck="false" readonly></textarea><div class="row" style="margin:0"><button class="p" id="cp3" data-i="copy">Копировать</button><button id="sv3" data-i="save">Сохранить .nc</button><button id="go3" data-i="play">В траекторию</button><button id="lb3" data-i="file">В «Файлы»</button></div><div class="s" id="m3"></div></div>
</div>
<div id="opEd" hidden></div>
</section>
<section id="t4" hidden>
<div class="cd"><div class="h">Материал заготовки</div><div class="seg wrap" id="matSeg"></div></div>
<div class="cd"><div class="h">Инструменты</div><div id="tlList"></div><div id="tlEd"></div><button id="tlAdd" class="wide" data-i="plus">Добавить инструмент</button></div>
<div class="cd"><div class="h">Режимы резания</div><div class="s">Расчёт для выбранного инструмента и материала. Эти значения подставляются в операции.</div><div class="ch" id="rcTools"></div><div class="kv" id="rcOut"></div></div>
<div class="cd"><div class="h">Станок</div><div class="pg"><label class="f"><span>Макс. обороты</span><input id="mcS" inputmode="decimal"></label><label class="f"><span>Скорость G0</span><input id="mcG" inputmode="decimal"></label><label class="f"><span>Смена инстр., с</span><input id="mcT" inputmode="decimal"></label></div></div>
</section>
<section id="t5" hidden>
<div class="cd"><button class="p wide" id="lbFromT" data-i="save" style="margin:0">Сохранить из «Траектории»</button><label class="f"><span>Поиск</span><input id="lbQ"></label><div class="s" id="lbMsg"></div></div>
<div id="lbList"></div>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var ST={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mach(){var m=ST.get('mach',{})||{};return {smax:+m.smax||10000,g0:+m.g0||24000,tc:m.tc===undefined||m.tc===''?6:+m.tc}}

var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=nm+'.nc';document.body.appendChild(a);a.click();a.remove();cb('Сохранено: '+nm+'.nc')}
var pts=[],idx=0,yaw=-0.6,pit=0.6,zm=1,px=0,py=0,m3=true,bb=null,STK=null;
function mb(s,i){var d=0;for(var j=i;j<s.length;j++){if(s[j]==='[')d++;else if(s[j]===']'){d--;if(d===0)return j}}return s.length-1}

function interp(src,opt){opt=opt||{};var dpi=opt.dpi!==false,lin=!!opt.lin,mc=mach();
var err='',V={},raw=[],msg=[],num=[],warn={},nPt=0,nM6=0;
String(src).split('\n').forEach(function(l,i){var m=(l.match(/\(([^)]*)\)/)||[])[1]||'',s=l.replace(/\([^)]*\)/g,'').replace(/\s+/g,'').toUpperCase().replace(/^\//,'');if(s&&s!=='%'){raw.push(s);msg.push(m);num.push(i+1)}});
var lab={};raw.forEach(function(s,i){var m=s.match(/^N(\d+)/);if(m)lab[+m[1]]=i});

var g=function(n){return V[n]||0};

function ev(e){e=e.replace(/\[/g,'(').replace(/\]/g,')').replace(/#(\d+)/g,'g($1)').replace(/GE|GT|LE|LT|EQ|NE/g,function(k){return cmp[k]});return +(new Function('g','SIN','COS','TAN','ATAN','SQRT','ABS','ROUND','FIX','FUP','return ('+e+')'))(g,F.SIN,F.COS,F.TAN,F.ATAN,F.SQRT,F.ABS,F.ROUND,F.FIX,F.FUP)}
var pc=0,x=0,y=0,z=0,abs=true,mode=0,steps=0,feed=0,cyc=0,cR=0,cZ=0,cQ=0,r98=true,initZ=0,curLn=0,zk=false,P=[];
function add(a,b,c,r){P.push({x:a,y:b,z:c,r:r,f:r?0:feed,ln:curLn})}
function known(nx,ny,nz,hasZ){if(zk)return true;if(hasZ){zk=true;x=nx;y=ny;z=nz;P.push({x:nx,y:ny,z:nz,r:1,f:0,ln:curLn,brk:1})}else{x=nx;y=ny}return false}
function rap(a,b,c){
if(lin){add(a,b,c,1)}else{var p=[x,y,z],t=[a,b,c],r=[0,1,2].map(function(i){return Math.abs(t[i]-p[i])}),sg=[0,1,2].map(function(i){return t[i]>=p[i]?1:-1}),n=0;
while(true){var act=[0,1,2].filter(function(i){return r[i]>1e-9});if(!act.length)break;var m=Math.min.apply(null,act.map(function(i){return r[i]}));act.forEach(function(i){p[i]+=sg[i]*m;r[i]-=m});add(p[0],p[1],p[2],1);n++}

x=a;y=b;z=c}
function lineTo(a,b,c){add(a,b,c,0);x=a;y=b;z=c}
function hole(hx,hy){rap(hx,hy,z);rap(hx,hy,cR);
if((cyc===83||cyc===73)&&cQ>0){var prev=cR,tgt,k=0;do{tgt=Math.max(cZ,prev-cQ);if(prev<cR-1e-9)rap(hx,hy,Math.min(cR,prev+0.5));lineTo(hx,hy,tgt);if(tgt>cZ+1e-9)rap(hx,hy,cR);prev=tgt;k++}while(tgt>cZ+1e-9&&k<2000)}

rap(hx,hy,r98?initZ:cR)}

try{
