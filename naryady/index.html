<style>
:root{--bg:#fff;--fg:#1a1a18;--mut:#6b6a64;--bd:#d6d4cc;--sf:#f4f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#ecebe5;--mut:#a3a199;--bd:#3a3935;--sf:#262624}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:12px;max-width:900px;margin:0 auto}
textarea{width:100%;box-sizing:border-box;height:170px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,label.b{font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:#1D9E75;color:#fff;border-color:#1D9E75}
canvas{display:block;width:100%;height:55vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input[type=range]{width:100%;margin:10px 0}
.s{font-size:13px;color:var(--mut)}
#er{font-size:13px;color:#D85A30}

section[hidden],[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
.tb{flex:1}.tb.on,.tl button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.tl{display:flex;gap:6px;overflow-x:auto;margin:6px 0;padding-bottom:2px}
.tl button,.tl select{flex:none;font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;white-space:nowrap}
.cw{position:relative}
.ov{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ov button{padding:4px 8px;font-size:12px}
#c2{display:block;width:100%;height:58vh;min-height:300px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;touch-action:none}
input.n{width:58px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--fg)}
details.s{margin:6px 0}
button[data-i],label[data-i]{display:inline-flex;align-items:center;gap:6px}
.tb{justify-content:center}
svg.i{width:20px;height:20px;flex:none}
#tools button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px}
.sb{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.sb button,.ov button{width:38px;height:38px;padding:0;justify-content:center;background:var(--bg);opacity:.93;display:flex;align-items:center}

details.s>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--fg);font-size:14px}
details.s>summary::-webkit-details-marker{display:none}
details.s>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}
details.s[open]>summary::after{transform:rotate(-135deg)}
.pi{margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:8px}
.pr{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}
.pr b{font-size:13px;font-weight:600;line-height:1.25;color:var(--fg)}
.pr small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.f{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.f:focus-within{border-color:#1D9E75}
.f span,.f em{font-size:12px;font-weight:600;color:var(--mut);font-style:normal}
.f input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;text-align:right}
#nok{justify-content:center;height:42px}
.cd{margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);display:grid;gap:12px}
.lb{font-size:12px;color:var(--mut);margin-bottom:5px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:8px 4px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}

.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.sw small{display:block;font-size:11px;color:var(--mut)}
.sw input{display:none}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.15s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:#1D9E75}
.sw input:checked+i::after{left:21px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#c3{display:block;width:100%;height:230px;min-height:0;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin:6px 0}

.tabs .tb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;line-height:1.2;min-width:0}
.wide{width:100%;justify-content:center;margin:8px 0}

.opi{display:flex;color:var(--mut);flex:none}
.opt{flex:1;min-width:0;cursor:pointer}.opt b{display:block;font-size:14px;font-weight:600}.opt small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ib{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib.arm,button.arm{border-color:#D85A30;color:#D85A30}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tg button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:12px;text-align:left}
.tg button b{font-size:14px;font-weight:600}.tg button small{font-size:11px;color:var(--mut);line-height:1.3}
.ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ch button{flex:none;white-space:nowrap;padding:7px 10px}
.ch button.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kv div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}.kv small{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:15px;font-weight:600}
.h{font-size:15px;font-weight:600}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);flex:none}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.danger{color:#D85A30}
.cd .lb{margin-top:2px}
#c3{height:240px}
#out3{height:200px}
#opEd .cd{margin:8px 0}

.mdc.on{border-color:#1D9E75}
#cadMode{margin-bottom:6px}
label.p{background:#1D9E75;color:#fff;border-color:#1D9E75}

.wide{box-sizing:border-box}

.f span{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

}

#nSetBox{margin:0;min-width:0;grid-template-columns:minmax(0,1fr)}
#nSetBox .pg{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#nSheet .pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#nSheet,#nSheet .cd{min-width:0}
#nSheet{overflow-x:hidden}
#t6 .f,#nSheet .f{min-width:0}
#t6 .f input,#nSheet .f input{min-width:40px}
.nrs{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.nrs span{flex:1;font-size:14px}
.nrs b{font-weight:600;color:#1D9E75}
.nrs button{padding:4px 10px;font-size:13px}
#nRaises{display:grid;gap:6px}
.nr .t small.earn{color:#1D9E75;font-weight:600}
#nSheet .hd small.earn{color:#1D9E75;font-weight:600}
.ngr small{display:flex;align-items:center;gap:6px}
.ngr .ic{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;color:#fff;flex:none}
.dayc .dnav{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.dayc .dnav button{width:34px;height:34px;padding:0;border-radius:10px;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.dayc .dnav button:disabled{opacity:.35}
.dayc .dlb{flex:1;position:relative;display:flex;align-items:center;justify-content:center;height:34px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);font-weight:600;font-size:15px;cursor:pointer}
.dayc .dlb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.dayc>b{font-size:22px}
.dayc .dayl{margin-top:8px;width:100%;justify-content:center;font-size:13px;padding:8px}
.drow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.drow .t{flex:1;min-width:0}.drow .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drow .t small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dx{width:30px;height:30px;color:#D85A30}
#nSheet{grid-template-columns:minmax(0,1fr)}
#nSheet>*{min-width:0}
.drow{min-width:0;box-sizing:border-box}
.drow .nq span{min-width:32px}
/* ---------- motion ---------- */
@keyframes nUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes nDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes nFadeIn{from{opacity:0}to{opacity:1}}
@keyframes nFadeOut{from{opacity:1}to{opacity:0}}
#nSheet{animation:nUp .34s cubic-bezier(.2,.9,.25,1)}
#nSheet.re{animation:none}
#nSheetBg{animation:nFadeIn .25s ease}
#nSheet.shOut{pointer-events:none;animation:nDown .22s cubic-bezier(.5,0,.8,.4) forwards}
#nSheetBg.shOut{pointer-events:none;animation:nFadeOut .22s ease forwards}
body.nar button{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
body.nar button:active:not(:disabled){transform:scale(.94)}
.nr,.drow{transition:border-color .25s ease,background-color .25s ease,transform .12s ease}
.nr:active{transform:scale(.985)}
.nhero{background-size:200% 200%;animation:nGlow 9s ease-in-out infinite}
@keyframes nGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.nhero{background-image:linear-gradient(135deg,#1D9E75,#137258,#1FA77E,#137258)}
.seg button.on{transition:background-color .25s ease,color .25s ease,box-shadow .25s ease}
.drow.fr{border-style:dashed}
.drow .tk{flex:none;height:32px;padding:0 10px;font-size:13px;border-radius:8px;white-space:nowrap}
/* launch */
#splash{position:fixed;inset:0;z-index:200;background:#171B1F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none;animation:none!important}
#splash svg{width:120px;height:120px;border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:spIn .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-doc{animation:spDoc .55s .1s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50px 51px}
#splash .sp-l{stroke-dasharray:26;stroke-dashoffset:26;animation:spLine .35s ease forwards}
#splash .sp-l1{animation-delay:.35s}#splash .sp-l2{animation-delay:.47s}#splash .sp-l3{animation-delay:.59s}
#splash .sp-coin{transform-origin:68px 72px;animation:spCoin .5s .7s cubic-bezier(.3,1.7,.5,1) both}
#splash b{color:#E8ECEF;font:600 22px/1 system-ui,sans-serif;letter-spacing:.5px;animation:spTxt .5s .55s ease both}
#splash i{display:block;width:90px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;animation:spTxt .4s .6s ease both}
#splash i::after{content:"";display:block;height:100%;width:40%;background:#1D9E75;border-radius:2px;animation:spBar .9s .6s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes spDoc{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes spLine{to{stroke-dashoffset:0}}
@keyframes spCoin{from{opacity:0;transform:scale(0) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes spTxt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
body.nar.enter .mrow,body.nar.enter .nhero,body.nar.enter .ngr>div,body.nar.enter #nSend,body.nar.enter .nright>*{animation:spTxt .45s cubic-bezier(.2,.8,.2,1) both}
body.nar.enter .nhero{animation:spTxt .45s .05s cubic-bezier(.2,.8,.2,1) both,nGlow 9s ease-in-out infinite}
body.nar.enter .ngr>div:nth-child(1){animation-delay:.1s}body.nar.enter .ngr>div:nth-child(2){animation-delay:.14s}body.nar.enter .ngr>div:nth-child(3){animation-delay:.18s}body.nar.enter .ngr>div:nth-child(4){animation-delay:.22s}body.nar.enter .ngr>div:nth-child(5){animation-delay:.26s}body.nar.enter #nSend{animation-delay:.3s}body.nar.enter .nright>*{animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
body.boot main{visibility:hidden}
.nr .fv{flex:none;width:24px;height:28px;margin:0 -6px 0 -8px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nr .fv svg{width:13px;height:13px;fill:none;stroke:var(--mut);stroke-width:1.5;stroke-linejoin:round;opacity:.28}
.nr.fav .fv svg{fill:#C9A050;stroke:#C9A050;opacity:.75}
.fvb{display:flex;align-items:center;gap:8px;height:36px;font-size:13px;color:var(--mut);background:transparent;border:1px dashed var(--bd);border-radius:10px;padding:0 12px;justify-content:center}
.fvb svg,.fvbar svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.fvbar{display:flex;align-items:center;gap:6px;min-width:0}
.fvbar span{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;color:#C9A050;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fvbar span svg{fill:#C9A050;stroke:#C9A050}
.fvbar button{flex:none;width:40px;height:34px;padding:0;font-size:16px}
.fvbar button:disabled{opacity:.35}
body.nar main{display:block;max-width:900px;margin:0 auto}
#topbar img{width:30px;height:30px;border-radius:8px}
#iosHint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;background:#1D9E75;color:#fff;border-radius:14px;padding:12px 40px 12px 14px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#iosHint button{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:transparent;color:#fff;font-size:18px;padding:0}
@media (min-width:1100px) and (hover:hover) and (pointer:fine){body.nar main{max-width:1200px;padding:16px 20px}}
