name: Build APK and EXE

on:
  push:
    branches: [main, master]
    paths-ignore: ['naryady/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GcodeViewer-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GcodeViewer-apk
          path: GcodeViewer-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: G-код ЧПУ 1.0.${{ github.run_number }}
          body: Сборка из коммита ${{ github.sha }}. APK — для Android, EXE — для Windows 10/11 (установка не нужна, просто запустите). iPhone — откройте в Safari https://etoneyaeslichto.github.io/gcode-viewer/ и добавьте на экран «Домой».
          files: GcodeViewer-*.apk
          make_latest: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        run: dotnet publish windows/GcodeViewer.csproj -c Release -o out -p:Version=1.0.${{ github.run_number }}

      - name: Rename EXE
        run: copy out\GcodeViewer.exe GcodeViewer-1.0.${{ github.run_number }}.exe
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: GcodeViewer-exe
          path: GcodeViewer-*.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: GcodeViewer-*.exe

  iphone:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Build web app for iPhone
        run: sh ios/pages.sh 1.0.${{ github.run_number }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
